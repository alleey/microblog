name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17' 

      - name: Build Java project with Maven
        run: |
          cd services
          mvn clean install

  build-angular:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14'

      - name: Install npm dependencies
        run: |
          cd webapp/main
          npm install

      - name: Build Angular project
        run: |
          cd webapp/main
          npm run build --prod
